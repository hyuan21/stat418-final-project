services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: nba-playoff-api:latest
    container_name: nba-playoff-api
    ports:
      - "8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
      - FLASK_ENV=production
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    image: nba-playoff-app:latest
    container_name: nba-playoff-app
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8080
      - PYTHONUNBUFFERED=1
    depends_on:
      - api
    restart: unless-stopped

networks:
  default:
    name: nba-playoff-net
