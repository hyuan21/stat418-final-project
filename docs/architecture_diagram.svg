<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="Calibri, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1100" height="720" fill="#F8FAFC"/>

  <!-- Title -->
  <text x="550" y="40" text-anchor="middle" font-size="26" font-weight="bold" fill="#0F172A">
    NBA Playoff Underperformance Predictor — System Architecture
  </text>
  <text x="550" y="62" text-anchor="middle" font-size="13" fill="#64748B" font-style="italic">
    Data flows left to right: scraping → feature engineering → training → serving
  </text>

  <!-- Layer band 1: Data Source -->
  <rect x="20" y="100" width="180" height="540" rx="14" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="110" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A8A">DATA SOURCE</text>

  <rect x="40" y="290" width="140" height="100" rx="10" fill="#1E3A8A" filter="url(#shadow)"/>
  <text x="110" y="325" text-anchor="middle" font-size="16" font-weight="bold" fill="white">NBA Stats API</text>
  <text x="110" y="348" text-anchor="middle" font-size="12" fill="#CBD5E1">nba_api</text>
  <text x="110" y="365" text-anchor="middle" font-size="11" fill="#CBD5E1">2003-04 — 2024-25</text>
  <text x="110" y="380" text-anchor="middle" font-size="11" fill="#CBD5E1">22 seasons</text>

  <!-- Layer band 2: Offline Pipeline -->
  <rect x="220" y="100" width="320" height="540" rx="14" fill="#F0FDF4" stroke="#BBF7D0"/>
  <text x="380" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">OFFLINE PIPELINE</text>

  <rect x="240" y="155" width="280" height="80" rx="10" fill="white" stroke="#86EFAC" filter="url(#shadow)"/>
  <text x="380" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#0F172A">Scraper</text>
  <text x="380" y="200" text-anchor="middle" font-size="11" fill="#475569">src/data/collect_game_logs.py</text>
  <text x="380" y="216" text-anchor="middle" font-size="11" fill="#475569">rate-limited · resumable · cached</text>

  <rect x="240" y="245" width="280" height="60" rx="10" fill="#FEF3C7" stroke="#FCD34D"/>
  <text x="380" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400E">Raw JSON</text>
  <text x="380" y="290" text-anchor="middle" font-size="11" fill="#92400E">data/raw/ (~600 MB)</text>

  <rect x="240" y="315" width="280" height="90" rx="10" fill="white" stroke="#86EFAC" filter="url(#shadow)"/>
  <text x="380" y="340" text-anchor="middle" font-size="14" font-weight="bold" fill="#0F172A">Feature Engineering</text>
  <text x="380" y="360" text-anchor="middle" font-size="11" fill="#475569">src/data/build_features.py</text>
  <text x="380" y="376" text-anchor="middle" font-size="11" fill="#475569">45 features · z-score normalized</text>
  <text x="380" y="392" text-anchor="middle" font-size="11" fill="#DC2626" font-weight="bold">Information lock at tip-off</text>

  <rect x="240" y="415" width="280" height="60" rx="10" fill="#FEF3C7" stroke="#FCD34D"/>
  <text x="380" y="440" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400E">Processed Parquet</text>
  <text x="380" y="460" text-anchor="middle" font-size="11" fill="#92400E">~45,000 playoff player-games</text>

  <rect x="240" y="485" width="280" height="90" rx="10" fill="white" stroke="#86EFAC" filter="url(#shadow)"/>
  <text x="380" y="510" text-anchor="middle" font-size="14" font-weight="bold" fill="#0F172A">Model Training</text>
  <text x="380" y="530" text-anchor="middle" font-size="11" fill="#475569">Logistic · RF · XGBoost (Optuna)</text>
  <text x="380" y="546" text-anchor="middle" font-size="11" fill="#475569">TimeSeriesSplit CV · SHAP</text>
  <text x="380" y="562" text-anchor="middle" font-size="11" fill="#475569">src/models/train.py</text>

  <rect x="240" y="585" width="280" height="40" rx="10" fill="#7C3AED" filter="url(#shadow)"/>
  <text x="380" y="610" text-anchor="middle" font-size="13" font-weight="bold" fill="white">model.pkl + feature_columns.json</text>

  <!-- Layer band 3: Serving -->
  <rect x="560" y="100" width="300" height="540" rx="14" fill="#FEF2F2" stroke="#FECACA"/>
  <text x="710" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#991B1B">CLOUD SERVING</text>

  <rect x="580" y="170" width="260" height="160" rx="10" fill="#059669" filter="url(#shadow)"/>
  <text x="710" y="200" text-anchor="middle" font-size="16" font-weight="bold" fill="white">Flask API</text>
  <text x="710" y="222" text-anchor="middle" font-size="12" fill="#D1FAE5">Google Cloud Run</text>
  <line x1="600" y1="232" x2="820" y2="232" stroke="#34D399" stroke-width="1"/>
  <text x="710" y="250" text-anchor="middle" font-size="11" fill="white">POST /v1/predict</text>
  <text x="710" y="267" text-anchor="middle" font-size="11" fill="white">GET  /v1/players · /v1/teams</text>
  <text x="710" y="284" text-anchor="middle" font-size="11" fill="white">GET  /v1/health · /docs (Swagger)</text>
  <text x="710" y="310" text-anchor="middle" font-size="10" fill="#A7F3D0" font-style="italic">Stateless · 1GB memory · 2 workers</text>

  <rect x="580" y="370" width="260" height="160" rx="10" fill="#DC2626" filter="url(#shadow)"/>
  <text x="710" y="400" text-anchor="middle" font-size="16" font-weight="bold" fill="white">Streamlit App</text>
  <text x="710" y="422" text-anchor="middle" font-size="12" fill="#FEE2E2">Google Cloud Run (Streamlit)</text>
  <line x1="600" y1="432" x2="820" y2="432" stroke="#F87171" stroke-width="1"/>
  <text x="710" y="450" text-anchor="middle" font-size="11" fill="white">Player + opponent picker</text>
  <text x="710" y="467" text-anchor="middle" font-size="11" fill="white">Advanced what-if sliders</text>
  <text x="710" y="484" text-anchor="middle" font-size="11" fill="white">SHAP explanations</text>
  <text x="710" y="510" text-anchor="middle" font-size="10" fill="#FECACA" font-style="italic">Reads API_URL from secrets</text>

  <!-- User -->
  <rect x="880" y="100" width="200" height="540" rx="14" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="980" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#0F172A">USER</text>

  <circle cx="980" cy="370" r="32" fill="#475569"/>
  <circle cx="980" cy="358" r="12" fill="#94A3B8"/>
  <path d="M 962 408 Q 980 388 998 408 L 998 425 L 962 425 Z" fill="#94A3B8"/>
  <text x="980" y="455" text-anchor="middle" font-size="13" fill="#0F172A" font-weight="bold">Web Browser</text>
  <text x="980" y="475" text-anchor="middle" font-size="11" fill="#475569">Instructor · classmates</text>
  <text x="980" y="491" text-anchor="middle" font-size="11" fill="#475569">June 2 – June 9, 2026</text>

  <!-- Arrows -->
  <line x1="200" y1="340" x2="240" y2="195" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="380" y1="235" x2="380" y2="245" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="380" y1="305" x2="380" y2="315" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="380" y1="405" x2="380" y2="415" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="380" y1="475" x2="380" y2="485" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="380" y1="575" x2="380" y2="585" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520" y1="605" x2="580" y2="250" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="4,3"/>
  <line x1="520" y1="455" x2="580" y2="280" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="2,3"/>
  <line x1="710" y1="370" x2="710" y2="370" stroke="none"/>
  <line x1="710" y1="330" x2="710" y2="370" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="725" y="357" font-size="11" fill="#475569" font-style="italic">REST</text>
  <line x1="840" y1="450" x2="950" y2="380" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="900" y="405" font-size="11" fill="#475569" font-style="italic">HTTPS</text>

  <!-- Legend / labels under arrows -->
  <text x="100" y="395" font-size="10" fill="#475569" font-style="italic">HTTPS scrape</text>
  <text x="540" y="595" font-size="10" fill="#475569" font-style="italic">model artifact</text>
  <text x="540" y="450" font-size="10" fill="#475569" font-style="italic">lookup tables</text>

  <!-- Footer -->
  <text x="550" y="685" text-anchor="middle" font-size="11" fill="#94A3B8">
    Hanzhang Yuan · STAT 418 Final Project · Spring 2026
  </text>
</svg>
