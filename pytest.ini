[pytest]
# Use importlib mode so that two `tests/` packages don't collide.
# Without this, pytest's "prepend" mode adds both `tests/` directories
# to sys.path under the same module name and the second collection fails.
addopts = --import-mode=importlib

testpaths =
    tests
    api/tests

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
